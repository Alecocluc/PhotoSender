<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: http://127.0.0.1:* http://localhost:*; connect-src http://127.0.0.1:* http://localhost:*; script-src 'self';" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pherry</title>
<link rel="icon" href="pherry-icon.svg" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="views/receiver.css" />
<link rel="stylesheet" href="views/photos.css" />
<link rel="stylesheet" href="views/history.css" />
<link rel="stylesheet" href="views/settings.css" />
</head>
<body>
  <div class="app">
    <nav class="rail" aria-label="Pherry">
      <div class="brand">
        <img class="brand-tile" src="pherry-icon.svg" width="30" height="30" alt="" />
        <span class="brand-word">Pherry</span>
      </div>
      <button class="nav-item" data-view="receiver" title="Receiver" data-icon="tray" aria-current="page"><span class="label-text">Receiver</span></button>
      <button class="nav-item" data-view="photos" title="Photos" data-icon="images-square"><span class="label-text">Photos</span><span class="count" id="nav-photos-count"></span></button>
      <button class="nav-item" data-view="history" title="History" data-icon="clock-counter-clockwise"><span class="label-text">History</span></button>
      <button class="nav-item" data-view="settings" title="Settings" data-icon="gear-six"><span class="label-text">Settings</span></button>
      <div class="rail-spacer"></div>
      <div class="station" id="station">
        <div class="station-line"><span class="lamp" id="station-lamp"></span><span class="station-text" id="station-text" aria-live="polite">Starting…</span></div>
        <div class="station-addr" id="station-addr"></div>
        <div class="station-actions">
          <button class="btn quiet sm icon-only" id="open-folder-btn" title="Open the Pherry folder" aria-label="Open the Pherry folder"></button>
          <button class="btn quiet sm icon-only" id="theme-toggle" title="Switch theme" aria-label="Switch theme"></button>
        </div>
      </div>
    </nav>

    <main class="main" id="main">
      <div class="main-inner" id="view-root"></div>
    </main>
  </div>

  <!-- Toast live regions exist from the start, so the first message of a session is announced. -->
  <div class="toast-root" id="toast-root">
    <div class="toast-stack" id="toast-status" role="status" aria-live="polite"></div>
    <div class="toast-stack" id="toast-alert" role="alert" aria-live="assertive"></div>
  </div>

<script type="module" src="app.js"></script>
</body>
</html>
