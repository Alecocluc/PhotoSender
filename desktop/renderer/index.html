<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: http://127.0.0.1:* http://localhost:*; connect-src http://127.0.0.1:* http://localhost:*; script-src 'self';" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PhotoSender Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="scrim" id="scrim"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo"><span class="icon">photo_camera</span></div>
        <div class="brand-text">
          <div class="brand-name">PhotoSender</div>
          <div class="brand-sub">Precision Pilot</div>
        </div>
      </div>
      <button class="nav-item active" data-view="dashboard"><span class="icon sm">dashboard</span>Dashboard</button>
      <button class="nav-item" data-view="activity"><span class="icon sm">graphic_eq</span>Activity Log</button>
      <button class="nav-item" data-view="history"><span class="icon sm">history</span>History</button>
      <button class="nav-item" data-view="settings"><span class="icon sm">settings</span>Settings</button>
      <div class="nav-spacer"></div>
      <div class="sidebar-card" id="sidebar-devices">
        <div class="label"><span class="pulse"></span>Sources</div>
        <div class="devices" id="device-list">
          <div class="device" title="No sources"><span class="icon xs">phonelink_off</span></div>
        </div>
      </div>
    </aside>

    <header class="topbar">
      <button class="icon-btn hamburger" id="hamburger" aria-label="Open menu"><span class="icon">menu</span></button>
      <h1 id="page-title">Dashboard Overview</h1>
      <span class="topbar-tag" id="page-tag" hidden><span class="pulse"></span><span id="page-tag-text">LIVE</span></span>
      <div class="topbar-actions">
        <span class="status-chip" id="server-chip"><span class="dot"></span>Active</span>
        <button class="icon-btn" id="open-folder-btn" title="Open download folder"><span class="icon">folder_open</span></button>
        <button class="icon-btn" id="clear-history-btn" title="Clear history"><span class="icon">delete_outline</span></button>
        <button class="icon-btn" id="theme-toggle" title="Toggle theme"><span class="icon" id="theme-icon">dark_mode</span></button>
      </div>
    </header>

    <main class="main">
      <div class="main-inner" id="view-root"></div>
    </main>

    <footer class="footer">
      <span class="dot" id="server-dot"></span>
      <span class="label-key">Local IP:</span>
      <span class="value" id="server-ip">—</span>
      <span class="sep">•</span>
      <span class="label-key">Status:</span>
      <span class="value" id="server-status-text">CONNECTED</span>
      <div class="right">
        <span class="label-key hide-sm">Port</span>
        <span class="value" id="server-port">—</span>
        <span class="pill hide-sm" id="link-pill">LINK-STATE: NOMINAL</span>
      </div>
    </footer>
  </div>

<script type="module" src="app.js"></script>
</body>
</html>
